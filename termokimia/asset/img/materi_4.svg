>cangkir isolasi + larutan</text><text x="308" y="158" font-size="23" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >q = m × c × ΔT</text><text x="308" y="198" font-size="23" font-weight="800" fill="#F26A21" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >ΔH = −q ÷ n</text><text x="308" y="240" font-size="14" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >c air = 4,18 J g⁻¹ °C⁻¹</text><text x="308" y="266" font-size="14" font-weight="800" fill="#F26A21" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Suhu naik: ΔH negatif</text><text x="308" y="292" font-size="14" font-weight="800" fill="#3B8CFF" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Suhu turun: ΔH positif</text><text x="308" y="332" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >tutup, termometer, pengaduk</text><text x="308" y="352" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >menjaga kalor tetap di sistem</text><rect x="30" y="442" width="540" height="250" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="474" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: 100 g larutan naik 6,8 °C; n = 0,05 mol</text><text x="60" y="514" font-size="16" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >q = 100 × 4,18 × 6,8 = 2.842 J = 2,84 kJ</text><text x="60" y="548" font-size="16" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔH = −2,84 ÷ 0,05</text><rect x="60" y="572" width="480" height="54" rx="14" fill="#1E8E5A" /><text x="300" y="607" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔH = −56,8 kJ/mol  (eksoterm)</text><text x="300" y="662" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kalorimeter bom: q = C × ΔT (C = kapasitas kalor alat)</text></svg>