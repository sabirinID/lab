</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Entalpi Pembentukan Standar</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Menghitung ΔH dari tabel</text><rect x="30" y="110" width="540" height="116" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="156" font-size="22" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >ΔH° = Σ ΔHf° produk − Σ ΔHf° pereaksi</text><text x="300" y="192" font-size="14" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔHf° unsur dalam bentuk standar = 0</text><text x="300" y="252" font-size="15.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Pembakaran CH₄: CH₄ + 2O₂ → CO₂ + 2H₂O(l)</text><rect x="44" y="272" width="112" height="72" rx="14" fill="#fff" stroke="#25508C" stroke-width="3" filter="url(#sh)"/><text x="100" y="304" font-size="17" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CH₄</text><text x="100" y="330" font-size="13" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >−74,8 kJ/mol</text><rect x="178" y="272" width="112" height="72" rx="14" fill="#fff" stroke="#5A6B84" stroke-width="3" filter="url(#sh)"/><text x="234" y="304" font-size="17" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >O₂</text><text x="234" y="330" font-size="13" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >0 kJ/mol</text><rect x="312" y="272" width="112" height="72" rx="14" fill="#fff" stroke="#F26A21" stroke-width="3" filter="url(#sh)"/><text x="368" y="304" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CO₂</text><text x="368" y="330" font-size="13" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >−393,5 kJ/mol</text><rect x="446" y="272" width="112" height="72" rx="14" fill="#fff" stroke="#F26A21" stroke-width="3" filter="url(#sh)"/><text x="502" y="304" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >H₂O(l)</text><text x="502" y="330" font-size="13" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >−285,8 kJ/mol</text><rect x="30" y="364" width="540" height="328" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="396" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Perhitungan</text><text x="54" y="436" font-size="15.5" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Σ ΔHf° produk = (−393,5) + 2(−285,8) = −965,1</text><text x="54" y="472" font-size="15.5" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Σ ΔHf° pereaksi = (−74,8) + 2(0) = −74,8</text><text x="54" y="516" font-size="17" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔH = −965,1 − (−74,8)</text><rect x="130" y="540" width="340" height="56" rx="14" fill="#1E8E5A" /><text x="300" y="577" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔH = −890,3 kJ</text><text x="300" y="632" font-size="13.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Koefisien reaksi mengalikan nilai ΔHf°</text><text x="300" y="656" font-size="13.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Jangan lupa tanda negatif saat mengurangkan</text></svg>