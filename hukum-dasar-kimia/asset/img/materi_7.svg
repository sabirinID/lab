</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Menerapkan Hukum Dasar</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Dari percobaan ke perhitungan</text><rect x="30" y="108" width="540" height="270" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="134" font-size="15" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Mg 6 g + O 3 g  (Mg : O = 3 : 2)</text><rect x="70" y="196" width="60" height="132" rx="10" fill="#F26A21" stroke="#fff" stroke-width="2" /><text x="100" y="262" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mg 6 g</text><rect x="150" y="262" width="60" height="66" rx="10" fill="#2E9BD6" stroke="#fff" stroke-width="2" /><text x="180" y="298" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >O 3 g</text><line x1="228" y1="270" x2="262" y2="270" stroke="#0E2240" stroke-width="4" stroke-linecap="round"/><polygon points="262.0,270.0 253.0,274.3 253.0,265.7" fill="#0E2240"/><rect x="290" y="229.0" width="60" height="99.0" rx="10" fill="#F26A21" stroke="#fff" stroke-width="2" /><rect x="290" y="163.0" width="60" height="66" rx="10" fill="#2E9BD6" stroke="#fff" stroke-width="2" /><rect x="370" y="295.0" width="60" height="33.0" rx="10" fill="#F26A21" stroke="#fff" stroke-width="2" stroke-dasharray="4 3"/><text x="320" y="246" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >MgO 7,5 g</text><text x="400" y="314" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >1,5 g</text><text x="320" y="348" font-size="12" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >produk</text><text x="400" y="348" font-size="12" font-weight="800" fill="#C0392B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mg sisa</text><line x1="50" y1="328" x2="550" y2="328" stroke="#0E2240" stroke-width="3" stroke-linecap="round"/><text x="300" y="370" font-size="12.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >O pembatas: Mg bereaksi 3 ÷ 2 × 3 = 4,5 g</text><rect x="30" y="394" width="540" height="298" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="422" font-size="15" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Langkah penyelesaian soal Proust</text><rect x="46" y="446" width="508" height="50" rx="12" fill="#F4F7FB" stroke="#25508C" stroke-width="2.5" /><circle cx="76" cy="471" r="15" fill="#25508C" stroke="#fff" stroke-width="2" /><text x="76" y="477" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >1</text><text x="104" y="476" font-size="13" font-weight="800" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Tulis perbandingan massa unsur: Mg : O = 3 : 2</text><rect x="46" y="504" width="508" height="50" rx="12" fill="#F4F7FB" stroke="#F26A21" stroke-width="2.5" /><circle cx="76" cy="529" r="15" fill="#F26A21" stroke="#fff" stroke-width="2" /><text x="76" y="535" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >2</text><text x="104" y="534" font-size="13" font-weight="800" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hitung unsur yang diperlukan dari yang tersedia</text><rect x="46" y="562" width="508" height="50" rx="12" fill="#F4F7FB" stroke="#1E8E5A" stroke-width="2.5" /><circle cx="76" cy="587" r="15" fill="#1E8E5A" stroke="#fff" stroke-width="2" /><text x="76" y="593" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >3</text><text x="104" y="592" font-size="13" font-weight="800" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Bandingkan: unsur yang kurang adalah pembatas</text><rect x="46" y="620" width="508" height="50" rx="12" fill="#F4F7FB" stroke="#7B4FC9" stroke-width="2.5" /><circle cx="76" cy="645" r="15" fill="#7B4FC9" stroke="#fff" stroke-width="2" /><text x="76" y="651" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >4</text><text x="104" y="650" font-size="13" font-weight="800" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Massa produk = jumlah massa yang bereaksi</text><text x="300" y="684" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Untuk gas: gunakan perbandingan volume (koefisien)</text></svg>