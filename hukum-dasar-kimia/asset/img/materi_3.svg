ang diperlukan = 14 ÷ 7 × 4 = 8 g</text><text x="300" y="526" font-size="13" font-weight="800" fill="#C0392B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >S yang berlebih = 10 − 8 = 2 g</text><rect x="70" y="556" width="200" height="50" rx="12" fill="#FFF1E6" stroke="#F26A21" stroke-width="2" /><text x="170" y="586" font-size="18" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >FeS = 22 g</text><rect x="330" y="556" width="200" height="50" rx="12" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="430" y="586" font-size="18" font-weight="800" fill="#C0392B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >S sisa = 2 g</text><text x="300" y="636" font-size="12.5" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >H : O = 1 : 8 pada H₂O · C : O = 3 : 8 pada CO₂</text><text x="300" y="664" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Unsur berlebih tidak ikut bereaksi</text></svg>