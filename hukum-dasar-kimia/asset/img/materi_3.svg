</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Hukum Perbandingan Tetap</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hukum Proust (1799)</text><rect x="30" y="108" width="540" height="280" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="134" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >MgO: perbandingan massa Mg : O selalu 3 : 2</text><rect x="76" y="285" width="80" height="18" rx="0" fill="#2E9BD6" stroke="#fff" stroke-width="2" /><rect x="76" y="303" width="80" height="27" rx="0" fill="#F26A21" stroke="#fff" stroke-width="2" /><text x="116" y="321.5" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mg 3 g</text><text x="116" y="299.0" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >O 2 g</text><text x="116" y="350" font-size="12.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >MgO 5 g</text><rect x="236" y="240" width="80" height="36" rx="0" fill="#2E9BD6" stroke="#fff" stroke-width="2" /><rect x="236" y="276" width="80" height="54" rx="0" fill="#F26A21" stroke="#fff" stroke-width="2" /><text x="276" y="308.0" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mg 6 g</text><text x="276" y="263.0" font-size="12.5" font-weight="800