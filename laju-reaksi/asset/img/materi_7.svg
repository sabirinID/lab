</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Pengaruh Suhu secara Kuantitatif</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Setiap +10 °C, laju dua kali</text><rect x="30" y="108" width="540" height="322" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><line x1="60" y1="380" x2="540" y2="380" stroke="#0E2240" stroke-width="3" stroke-linecap="round"/><rect x="84" y="353" width="72" height="27" rx="8" fill="#25508C" /><text x="120" y="343" font-size="18" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >×1</text><text x="120" y="404" font-size="14.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >30 °C</text><rect x="204" y="326" width="72" height="54" rx="8" fill="#F26A21" /><text x="240" y="316" font-size="18" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >×2</text><text x="240" y="404" font-size="14.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >40 °C</text><rect x="324" y="272" width="72" height="108" rx="8" fill="#F26A21" /><text x="360" y="262" font-size="18" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >×4</text><text x="360" y="404" font-size="14.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >50 °C</text><rect x="444" y="164" width="72" height="216" rx="8" fill="#F26A21" /><text x="480" y="154" font-size="18" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >×8</text><text x="480" y="404" font-size="14.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >60 °C</text><text x="300" y="140" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Laju reaksi relatif terhadap 30 °C</text><text x="300" y="164" font-size="13" font-weight="700" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >aturan: ×2 setiap kenaikan 10 °C</text><rect x="30" y="448" width="540" height="244" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="482" font-size="22" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >v₂ = v₁ × 2^((T₂ − T₁) ÷ 10)</text><text x="300" y="514" font-size="22" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >t₂ = t₁ ÷ 2^((T₂ − T₁) ÷ 10)</text><text x="300" y="550" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: 30 °C → 50 °C, waktu 40 menit</text><text x="300" y="574" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >ΔT = 20 °C  →  laju ×2² = ×4</text><rect x="150" y="592" width="300" height="52" rx="14" fill="#1E8E5A" /><text x="300" y="626" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >t₂ = 40 ÷ 4 = 10 menit</text><text x="300" y="672" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Aturan praktis, bukan hukum pasti</text></svg>