</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Hasil Kali Kelarutan (Ksp)</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Tetapan kesetimbangan kelarutan</text><rect x="30" y="108" width="540" height="170" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="140" font-size="20" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >AₘBₙ(s) ⇌ m Aⁿ⁺ + n Bᵐ⁻</text><text x="300" y="196" font-size="30" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = [Aⁿ⁺]ᵐ [Bᵐ⁻]ⁿ</text><text x="300" y="236" font-size="13.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >koefisien menjadi pangkat; padatan tidak ditulis</text><text x="300" y="262" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ksp hanya bergantung pada suhu</text><rect x="30" y="296" width="540" height="396" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="326" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh</text><rect x="50" y="344" width="500" height="80" rx="14" fill="#F4F7FB" stroke="#25508C" stroke-width="2.5" /><text x="300" y="374" font-size="16" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >AgCl ⇌ Ag⁺ + Cl⁻</text><text x="300" y="406" font-size="20" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = [Ag⁺][Cl⁻]</text><rect x="50" y="436" width="500" height="80" rx="14" fill="#F4F7FB" stroke="#F26A21" stroke-width="2.5" /><text x="300" y="466" font-size="16" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ag₂CrO₄ ⇌ 2Ag⁺ + CrO₄²⁻</text><text x="300" y="498" font-size="20" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = [Ag⁺]²[CrO₄²⁻]</text><rect x="50" y="528" width="500" height="80" rx="14" fill="#F4F7FB" stroke="#1E8E5A" stroke-width="2.5" /><text x="300" y="558" font-size="16" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ca₃(PO₄)₂ ⇌ 3Ca²⁺ + 2PO₄³⁻</text><text x="300" y="590" font-size="20" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = [Ca²⁺]³[PO₄³⁻]²</text><text x="300" y="636" font-size="13.5" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ksp kecil: garam sangat sukar larut</text><text x="300" y="660" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bandingkan s, bukan Ksp, untuk garam beda tipe</text></svg>