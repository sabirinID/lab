</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Memprediksi Pengendapan</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp dibandingkan dengan Ksp</text><rect x="30" y="108" width="540" height="218" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="138" font-size="15" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Bandingkan Qsp dengan Ksp</text><rect x="60" y="166" width="480" height="28" rx="14" fill="#D7DEEA" /><rect x="60" y="166" width="200" height="28" rx="14" fill="#D6E6FF" /><rect x="340" y="166" width="200" height="28" rx="14" fill="#FFE0C8" /><rect x="262" y="160" width="76" height="40" rx="10" fill="#1E8E5A" /><text x="300" y="186" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp = Ksp</text><text x="160" y="186" font-size="14" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp &lt; Ksp</text><text x="440" y="186" font-size="14" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp &gt; Ksp</text><text x="160" y="226" font-size="14" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >belum jenuh</text><text x="160" y="248" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >tidak mengendap</text><text x="300" y="226" font-size="14" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >tepat jenuh</text><text x="300" y="248" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >batas endapan</text><text x="440" y="226" font-size="14" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >lewat jenuh</text><text x="440" y="248" font-size="13" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >MENGENDAP</text><text x="300" y="292" font-size="12.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp dihitung dari konsentrasi setelah pencampuran</text><rect x="30" y="344" width="540" height="348" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="374" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh</text><text x="300" y="402" font-size="14.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >50 mL AgNO₃ 1×10⁻⁵ M + 50 mL NaCl 1×10⁻⁵ M</text><text x="300" y="434" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >volume menjadi 100 mL, konsentrasi menjadi setengah</text><text x="300" y="466" font-size="17" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >[Ag⁺] = [Cl⁻] = 5×10⁻⁶ M</text><text x="300" y="504" font-size="17" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Qsp = (5×10⁻⁶)(5×10⁻⁶) = 2,5×10⁻¹¹</text><rect x="80" y="530" width="440" height="60" rx="14" fill="#E8F6EF" stroke="#1E8E5A" stroke-width="2" /><text x="300" y="556" font-size="17" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >2,5×10⁻¹¹ &lt; Ksp (1×10⁻¹⁰)</text><text x="300" y="580" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >tidak terbentuk endapan</text><text x="300" y="626" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Jika konsentrasi masing-masing 4×10⁻⁵ M:</text><text x="300" y="652" font-size="14.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Qsp = 4×10⁻¹⁰ &gt; Ksp → mengendap</text></svg>