, 'Times New Roman', serif" >Ksp = 4s³</text><rect x="50" y="274" width="500" height="54" rx="12" fill="#F4F7FB" stroke="#1E8E5A" stroke-width="2.5" /><text x="70" y="298" font-size="15" font-weight="800" fill="#1E8E5A" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >A₂B₃ atau A₃B₂</text><text x="70" y="318" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ca₃(PO₄)₂</text><text x="530" y="310" font-size="21" font-weight="800" fill="#0E2240" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" >Ksp = 108 s⁵</text><text x="300" y="350" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >s dalam mol/L pada larutan jenuh</text><rect x="30" y="376" width="262" height="316" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><rect x="308" y="376" width="262" height="316" rx="16" fill="#fff" stroke="#F26A21" stroke-width="2" filter="url(#sh)"/><rect x="61.0" y="390.0" width="200" height="28" rx="14.0" fill="#FFC21A" /><text x="161" y="408.55" font-size="13" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Dari s menjadi Ksp</text><rect x="339.0" y="390.0" width="200" height="28" rx="14.0" fill="#F26A21" /><text x="439" y="408.55" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Dari Ksp menjadi s</text><text x="161" y="444" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ag₂CrO₄: s = 1×10⁻⁴ M</text><text x="161" y="474" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >[Ag⁺] = 2s, [CrO₄²⁻] = s</text><text x="161" y="508" font-size="15" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = (2s)² · s = 4s³</text><text x="161" y="540" font-size="14.5" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >= 4 × (10⁻⁴)³</text><rect x="66" y="566" width="190" height="48" rx="12" fill="#1E8E5A" /><text x="161" y="598" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >4×10⁻¹²</text><text x="439" y="444" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CaF₂: Ksp = 3,2×10⁻¹¹</text><text x="439" y="474" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ksp = s · (2s)² = 4s³</text><text x="439" y="508" font-size="15" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >s³ = 3,2×10⁻¹¹ ÷ 4</text><text x="439" y="540" font-size="14.5" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >= 8×10⁻¹²</text><rect x="344" y="566" width="190" height="48" rx="12" fill="#1E8E5A" /><text x="439" y="598" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >s = 2×10⁻⁴ M</text><text x="300" y="664" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" ></text></svg>