</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Pengaruh pH pada Kelarutan</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hidroksida dan asam-basa</text><rect x="30" y="108" width="540" height="150" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="140" font-size="20" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Mg(OH)₂(s) ⇌ Mg²⁺ + 2OH⁻</text><text x="300" y="176" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Ksp = [Mg²⁺][OH⁻]² = 1×10⁻¹¹</text><text x="300" y="210" font-size="13.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pH naik: [OH⁻] naik, kelarutan turun</text><text x="300" y="236" font-size="13.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pH turun (asam): OH⁻ habis, endapan larut</text><rect x="30" y="276" width="540" height="150" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="298" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: [Mg²⁺] = 0,01 M</text><rect x="70.0" y="330" width="57.5" height="22" rx="0" fill="#E8453C" /><rect x="127.5" y="330" width="57.5" height="22" rx="0" fill="#F26A21" /><rect x="185.0" y="330" width="57.5" height="22" rx="0" fill="#FFC21A" /><rect x="242.5" y="330" width="57.5" height="22" rx="0" fill="#8BC34A" /><rect x="300.0" y="330" width="57.5" height="22" rx="0" fill="#3BA55D" /><rect x="357.5" y="330" width="57.5" height="22" rx="0" fill="#3B8CFF" /><rect x="415.0" y="330" width="57.5" height="22" rx="0" fill="#6A5ACD" /><rect x="472.5" y="330" width="57.5" height="22" rx="0" fill="#8E44AD" /><text x="74.0" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >7</text><text x="131.5" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >8</text><text x="189.0" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >9</text><text x="246.5" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >10</text><text x="304.0" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >11</text><text x="361.5" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >12</text><text x="419.0" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >13</text><text x="476.5" y="372" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >14</text><line x1="213.75" y1="322" x2="213.75" y2="358" stroke="#0E2240" stroke-width="4" stroke-linecap="round"/><text x="213.75" y="318" font-size="13" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pH 9,5</text><text x="170" y="400" font-size="13.5" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >larut</text><text x="440" y="400" font-size="13.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >mengendap</text><rect x="30" y="444" width="540" height="248" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="476" font-size="15" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >[OH⁻]² = Ksp ÷ [Mg²⁺] = 10⁻¹¹ ÷ 10⁻² = 10⁻⁹</text><text x="300" y="508" font-size="15" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >[OH⁻] = 10⁻⁴·⁵   →   pOH = 4,5</text><rect x="160" y="530" width="280" height="58" rx="14" fill="#1E8E5A" /><text x="300" y="568" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >pH = 14 − 4,5 = 9,5</text><text x="300" y="620" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Endapan Mg(OH)₂ mulai terbentuk pada pH 9,5</text><text x="300" y="648" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pH lebih tinggi: makin banyak endapan</text></svg>