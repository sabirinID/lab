ont-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Rumus molekul = (rumus empiris)ₙ</text><rect x="60" y="474" width="480" height="92" rx="14" fill="#EAFBF1" stroke="#1E8E5A" stroke-width="2.5" /><text x="300" y="502" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mr senyawa = 180 ;  Mr CH₂O = 30</text><text x="300" y="530" font-size="17" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >n = 180 ÷ 30 = 6</text><text x="300" y="556" font-size="18" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >(CH₂O)₆ = C₆H₁₂O₆</text><text x="300" y="604" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh lain</text><rect x="48" y="618" width="252" height="60" rx="12" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="2" /><text x="174" y="642" font-size="11.5" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Fe 69,9%  O 30,1%</text><text x="174" y="666" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Fe₂O₃</text><rect x="312" y="618" width="252" height="60" rx="12" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="2" /><text x="438" y="642" font-size="11.5" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Na 32,4%  S 22,6%  O 45,0%</text><text x="438" y="666" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Na₂SO₄</text></svg>