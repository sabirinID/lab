</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Rendemen</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Seberapa efisien reaksinya?</text><rect x="30" y="108" width="540" height="330" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="136" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hasil teoritis vs hasil nyata</text><rect x="70" y="170" width="460" height="54" rx="14" fill="#D7DEEA" /><rect x="70" y="170" width="460" height="54" rx="14" fill="#25508C" /><text x="300" y="204" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hasil teoritis: 36 g H₂O (100%)</text><rect x="70" y="250" width="460" height="54" rx="14" fill="#D7DEEA" /><rect x="70" y="250" width="368.0" height="54" rx="14" fill="#F26A21" /><text x="300" y="284" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hasil nyata: 28,8 g (80%)</text><rect x="190.0" y="327.0" width="220" height="34" rx="17.0" fill="#1E8E5A" /><text x="300" y="349.95" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Rendemen = 80%</text><text x="300" y="396" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Sebagian produk hilang saat dipindahkan,</text><text x="300" y="416" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bereaksi sebagian, atau terjadi reaksi samping</text><rect x="30" y="454" width="540" height="238" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="486" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Rendemen = (hasil nyata ÷ hasil teoritis) × 100%</text><rect x="70" y="506" width="460" height="80" rx="14" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="2" /><text x="300" y="534" font-size="18" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >28,8 g ÷ 36 g × 100%</text><text x="300" y="566" font-size="22" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >= 80%</text><text x="300" y="616" font-size="13" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hasil nyata tidak mungkin melebihi hasil teoritis</text><text x="300" y="642" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >(rendemen ≤ 100%)</text><text x="300" y="670" font-size="12.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Hasil teoritis dihitung dari pereaksi pembatas</text></svg>