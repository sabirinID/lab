serif" >massa (g)</text><text x="240" y="578" font-size="16" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >4 g</text><text x="360" y="578" font-size="16" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >32 g</text><text x="480" y="578" font-size="16" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >36 g</text><text x="300" y="636" font-size="12.5" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >4 g + 32 g = 36 g: massa sebelum dan sesudah reaksi sama</text><text x="300" y="660" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >(hukum kekekalan massa Lavoisier)</text><text x="300" y="682" font-size="12" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ubah semua data ke mol dulu</text></svg>