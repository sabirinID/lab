ont-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >+</text><rect x="478" y="428" width="108" height="54" rx="12" fill="#F4F7FB" stroke="#25508C" stroke-width="3" /><text x="532" y="456" font-size="20" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >OH⁻</text><text x="532" y="474" font-size="11.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >basa konjugasi</text><path d="M238,424 C238,392 98,392 98,422" stroke="#F26A21" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><polygon points="98.0,422.0 93.7,413.0 102.3,413.0" fill="#F26A21"/><text x="168" y="382" font-size="13" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >H⁺ berpindah</text><text x="98" y="508" font-size="12.5" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >basa 1</text><text x="238" y="508" font-size="12.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >asam 2</text><text x="398" y="508" font-size="12.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >asam 1</text><text x="532" y="508" font-size="12.5" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >basa 2</text><rect x="50" y="524" width="500" height="64" rx="14" fill="#EAF1FF" stroke="#25508C" stroke-width="2" /><text x="300" y="548" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Pasangan konjugasi:</text><text x="300" y="574" font-size="17" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman',