</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Teori Asam-Basa</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Memberi dan menerima proton</text><rect x="30" y="108" width="540" height="170" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><rect x="200.0" y="120.0" width="200" height="28" rx="14.0" fill="#25508C" /><text x="300" y="138.9" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Arrhenius</text><text x="300" y="176" font-size="15" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Asam: melepas H⁺ dalam air</text><text x="300" y="204" font-size="17" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >HCl → H⁺ + Cl⁻</text><text x="300" y="238" font-size="15" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Basa: melepas OH⁻ dalam air</text><text x="300" y="262" font-size="17" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >NaOH → Na⁺ + OH⁻</text><rect x="30" y="296" width="540" height="396" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><rect x="170.0" y="308.0" width="260" height="28" rx="14.0" fill="#F26A21" /><text x="300" y="326.9" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Brønsted–Lowry</text><text x="300" y