</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Hidrolisis Garam</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Garam yang tidak selalu netral</text><rect x="30" y="108" width="540" height="330" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="138" font-size="15" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Sifat garam dalam air</text><rect x="50" y="154" width="500" height="56" rx="12" fill="#F4F7FB" stroke="#1E8E5A" stroke-width="2.5" /><text x="68" y="178" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Asam kuat + basa kuat</text><text x="68" y="198" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >NaCl</text><text x="532" y="190" font-size="14.5" font-weight="800" fill="#1E8E5A" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >netral (pH = 7)</text><rect x="50" y="220" width="500" height="56" rx="12" fill="#F4F7FB" stroke="#7B4FC9" stroke-width="2.5" /><text x="68" y="244" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Asam lemah + basa kuat</text><text x="68" y="264" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CH₃COONa</text><text x="532" y="256" font-size="14.5" font-weight="800" fill="#7B4FC9" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >basa (pH &gt; 7)</text><rect x="50" y="286" width="500" height="56" rx="12" fill="#F4F7FB" stroke="#C0392B" stroke-width="2.5" /><text x="68" y="310" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Asam kuat + basa lemah</text><text x="68" y="330" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >NH₄Cl</text><text x="532" y="322" font-size="14.5" font-weight="800" fill="#C0392B" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >asam (pH &lt; 7)</text><rect x="50" y="352" width="500" height="56" rx="12" fill="#F4F7FB" stroke="#25508C" stroke-width="2.5" /><text x="68" y="376" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Asam lemah + basa lemah</text><text x="68" y="396" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CH₃COONH₄</text><text x="532" y="388" font-size="14.5" font-weight="800" fill="#25508C" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bergantung Ka dan Kb</text><text x="300" y="428" font-size="12.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >hanya ion dari asam atau basa lemah yang terhidrolisis</text><rect x="30" y="456" width="540" height="236" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="486" font-size="17" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻</text><text x="300" y="514" font-size="15.5" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >[OH⁻] = √(Kw ÷ Ka × [G])</text><text x="300" y="546" font-size="13.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CH₃COONa 0,1 M  (Ka = 1×10⁻⁵)</text><text x="300" y="574" font-size="14.5" font-weight="800" fill="#15243B" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >[OH⁻] = √(10⁻⁹ × 10⁻¹) = 10⁻⁵ M</text><rect x="170" y="592" width="260" height="52" rx="14" fill="#1E8E5A" /><text x="300" y="626" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >pOH = 5  →  pH = 9</text><text x="300" y="672" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Garam asam kuat + basa lemah: [H⁺] = √(Kw ÷ Kb × [G])</text></svg>