</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Larutan Penyangga</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Menjaga pH tetap stabil</text><rect x="30" y="108" width="540" height="250" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><rect x="90.0" y="120.0" width="420" height="28" rx="14.0" fill="#25508C" /><text x="300" y="138.55" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >asam lemah (HA) + basa konjugasinya (A⁻)</text><rect x="120" y="170" width="130" height="70" rx="14" fill="#EAF1FF" stroke="#25508C" stroke-width="3" /><text x="185" y="200" font-size="24" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >HA</text><text x="185" y="226" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >penetral basa</text><rect x="350" y="170" width="130" height="70" rx="14" fill="#FFF1E6" stroke="#F26A21" stroke-width="3" /><text x="415" y="200" font-size="24" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >A⁻</text><text x="415" y="226" font-size="12" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >penetral asam</text><text x="300" y="262" font-size="15" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >+ H⁺ :   A⁻ + H⁺ → HA</text><text x="300" y="292" font-size="15" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >+ OH⁻ :   HA + OH⁻ → A⁻ + H₂O</text><text x="300" y="330" font-size="13" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pH hampir tetap saat ditambah sedikit asam atau basa</text><rect x="30" y="376" width="540" height="316" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="408" font-size="22" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >[H⁺] = Ka × [HA] ÷ [A⁻]</text><text x="300" y="436" font-size="13" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CH₃COOH 0,1 M + CH₃COONa 0,1 M (Ka = 1×10⁻⁵)</text><rect x="190" y="450" width="220" height="46" rx="14" fill="#1E8E5A" /><text x="300" y="482" font-size="22" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >pH = 5</text><text x="300" y="524" font-size="13.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Pengaruh penambahan asam kuat</text><line x1="110" y1="650" x2="520" y2="650" stroke="#0E2240" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="540" x2="110" y2="650" stroke="#0E2240" stroke-width="3" stroke-linecap="round"/><polygon points="526.0,650.0 517.0,654.3 517.0,645.7" fill="#0E2240"/><polygon points="110.0,534.0 114.3,543.0 105.7,543.0" fill="#0E2240"/><text x="315.0" y="672" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" ></text><text x="76" y="595.0" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" transform="rotate(-90 76 595.0)">pH</text><line x1="112" y1="600" x2="518" y2="600" stroke