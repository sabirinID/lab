</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kuosien Reaksi</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ke mana reaksi bergerak?</text><rect x="30" y="108" width="540" height="230" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="140" font-size="15" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Bandingkan Q (sesaat) dengan K (setimbang)</text><rect x="60" y="176" width="480" height="24" rx="12" fill="#D7DEEA" /><rect x="60" y="176" width="200" height="24" rx="12" fill="#FFE0C8" /><rect x="340" y="176" width="200" height="24" rx="12" fill="#D6E6FF" /><rect x="262" y="170" width="76" height="36" rx="10" fill="#1E8E5A" /><text x="300" y="195" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Q = K</text><text x="160" y="195" font-size="14" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Q &lt; K</text><text x="440" y="195" font-size="14" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Q &gt; K</text><line x1="110" y1="252" x2="206.0" y2="252.0" stroke="#F26A21" stroke-width="5" stroke-linecap="round"/><polygon points="214.0,252.0 204.1,256.8 204.1,247.2" fill="#F26A21"/><text x="160" y="282" font-size="13.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bergeser ke kanan</text><text x="160" y="304" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >(produk bertambah)</text><text x="300" y="262" font-size="14" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >setimbang</text><text x="300" y="284" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >tidak ada</text><text x="300" y="304" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pergeseran netto</text><line x1="490" y1="252" x2="394.0" y2="252.0" stroke="#25508C" stroke-width="5" stroke-linecap="round"/><polygon points="386.0,252.0 395.9,247.2 395.9,256.8" fill="#25508C"/><text x="440" y="282" font-size="13.5" font-weight="800" fill="#25508C" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bergeser ke kiri</text><text x="440" y="304" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >(pereaksi bertambah)</text><rect x="30" y="356" width="540" height="336" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="388" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh</text><text x="300" y="418" font-size="19" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >H₂ + I₂ ⇌ 2HI    K = 64</text><text x="300" y="450" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >[H₂] = [I₂] = 0,1 M   |   [HI] = 0,4 M</text><text x="300" y="490" font-size="18" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Q = [HI]² ÷ ([H₂][I₂])</text><text x="300" y="522" font-size="15" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >= 0,4² ÷ (0,1 × 0,1) = 0,16 ÷ 0,01</text><rect x="190" y="540" width="220" height="48" rx="14" fill="#F26A21" /><text x="300" y="572" font-size="23" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Q = 16</text><rect x="70" y="606" width="460" height="62" rx="14" fill="#FFF1E6" stroke="#F26A21" stroke-width="2" /><text x="300" y="633" font-size="16" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >16 &lt; 64  →  Q &lt; K</text><text x="300" y="656" font-size="14" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >bergeser ke kanan sampai Q = 64</text></svg>