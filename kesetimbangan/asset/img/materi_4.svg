</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Tetapan Tekanan (Kp)</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Untuk reaksi gas</text><rect x="30" y="108" width="540" height="150" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="142" font-size="30" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kp = Kc (RT)^Δn</text><text x="300" y="174" font-size="13" font-weight="700" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >R = 0,082 L atm mol⁻¹ K⁻¹   |   T dalam kelvin</text><text x="300" y="204" font-size="13" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Δn = Σ koefisien gas produk − Σ koefisien gas pereaksi</text><text x="300" y="234" font-size="13" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kp memakai tekanan parsial (atm)</text><rect x="30" y="276" width="540" height="190" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="308" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Menentukan Δn</text><rect x="50" y="322" width="500" height="40" rx="10" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="1.5" /><text x="70" y="348" font-size="15" font-weight="800" fill="#25508C" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >N₂ + 3H₂ ⇌ 2NH₃</text><text x="530" y="348" font-size="14" font-weight="800" fill="#15243B" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Δn = 2 − 4 = −2</text><rect x="50" y="370" width="500" height="40" rx="10" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="1.5" /><text x="70" y="396" font-size="15" font-weight="800" fill="#F26A21" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >H₂ + I₂ ⇌ 2HI</text><text x="530" y="396" font-size="14" font-weight="800" fill="#15243B" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Δn = 2 − 2 = 0  →  Kp = Kc</text><rect x="50" y="418" width="500" height="40" rx="10" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="1.5" /><text x="70" y="444" font-size="15" font-weight="800" fill="#1E8E5A" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >2SO₂ + O₂ ⇌ 2SO₃</text><text x="530" y="444" font-size="14" font-weight="800" fill="#15243B" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Δn = 2 − 3 = −1</text><rect x="30" y="484" width="540" height="208" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="516" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: Kc = 82; T = 500 K; Δn = −1</text><text x="300" y="554" font-size="18" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kp = 82 × (0,082 × 500)⁻¹</text><text x="300" y="588" font-size="18" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >= 82 ÷ 41</text><rect x="190" y="606" width="220" height="54" rx="14" fill="#1E8E5A" /><text x="300" y="642" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kp = 2,0</text><text x="300" y="678" font-size="12" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" ></text></svg>