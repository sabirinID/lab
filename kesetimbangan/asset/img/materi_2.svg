</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Tetapan Kesetimbangan</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Rumus Kc</text><rect x="30" y="108" width="540" height="150" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="140" font-size="20" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >aA + bB ⇌ cC + dD</text><text x="300" y="192" font-size="27" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kc = [C]ᶜ [D]ᵈ ÷ ([A]ᵃ [B]ᵇ)</text><text x="300" y="232" font-size="13" font-weight="700" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >koefisien menjadi pangkat; produk di atas, pereaksi di bawah</text><rect x="30" y="276" width="540" height="150" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="300" y="306" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: sintesis amonia</text><text x="300" y="344" font-size="21" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >N₂(g) + 3H₂(g) ⇌ 2NH₃(g)</text><rect x="120" y="358" width="360" height="56" rx="14" fill="#FFF1E6" stroke="#F26A21" stroke-width="2" /><text x="300" y="395" font-size="22" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kc = [NH₃]² ÷ ([N₂][H₂]³)</text><rect x="30" y="444" width="540" height="248" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="474" font-size="14.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Nilai Kc menunjukkan posisi setimbang</text><rect x="70" y="500" width="460" height="22" rx="11" fill="#D7DEEA" /><rect x="70" y="500" width="230" height="22" rx="11" fill="#25508C" opacity=".0"/><linearGradient id="kg" x1="0" x2="1"><stop offset="0" stop-color="#25508C"/><stop offset="1" stop-color="#F26A21"/></linearGradient><rect x="70" y="500" width="460" height="22" rx="11" fill="url(#kg)" /><text x="70" y="548" font-size="13.5" font-weight="800" fill="#25508C" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kc kecil</text><text x="530" y="548" font-size="13.5" font-weight="800" fill="#F26A21" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kc besar</text><text x="70" y="568" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >pereaksi dominan</text><text x="530" y="568" font-size="12.5" font-weight="700" fill="#5A6B84" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >produk dominan</text><rect x="70" y="590" width="460" height="84" rx="12" fill="#F4F7FB" stroke="#D7DEEA" stroke-width="2" /><text x="300" y="616" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Padatan dan cairan murni tidak ditulis</text><text x="300" y="642" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >CaCO₃(s) ⇌ CaO(s) + CO₂(g)</text><text x="300" y="664" font-size="16" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Kc = [CO₂]</text></svg>