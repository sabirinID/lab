ia, 'Times New Roman', serif" >ΔTf = Kf × m × i</text><text x="300" y="524" font-size="13.5" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Tf larutan = Tf pelarut − ΔTf   (Kf air = 1,86 °C/m)</text><text x="300" y="556" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: glukosa 0,5 m → ΔTf = 1,86 × 0,5 = 0,93 °C</text><text x="300" y="580" font-size="16" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Tf larutan = −0,93 °C</text><rect x="150.0" y="603.0" width="300" height="26" rx="13.0" fill="#EEF2F8" /><text x="300" y="620.725" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Garam pada jalan bersalju</text><rect x="150.0" y="633.0" width="300" height="26" rx="13.0" fill="#EEF2F8" /><text x="300" y="650.725" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Antibeku radiator</text><rect x="150.0" y="663.0" width="300" height="26" rx="13.0" fill="#EEF2F8" /><text x="300" y="680.725" font-size="13.5" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Es puter (es + garam)</text></svg>