</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Aturan di Katoda</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Reduksi pada elektrolisis larutan</text><rect x="150" y="112" width="300" height="48" rx="12" fill="#0E2240" filter="url(#sh)"/><text x="300.0" y="141.6" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Reduksi di KATODA: kation?</text><line x1="300" y1="160" x2="300.0" y2="188.0" stroke="#0E2240" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,196.0 295.2,186.1 304.8,186.1" fill="#0E2240"/><rect x="190" y="196" width="220" height="50" rx="12" fill="#EEF2F8" stroke="#0E2240" stroke-width="2" filter="url(#sh)"/><text x="300.0" y="226.25" font-size="15" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Leburan atau larutan?</text><path d="M190,221 H130 V268" stroke="#0E2240" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><polygon points="130.0,270.0 125.7,261.0 134.3,261.0" fill="#0E2240"/><text x="160" y="214" font-size="13.5" font-weight="800" fill="#1E8E5A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Leburan</text><path d="M410,221 H450 V268" stroke="#0E2240" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><polygon points="450.0,270.0 445.7,261.0 454.3,261.0" fill="#0E2240"/><text x="430" y="214" font-size="13.5" font-weight="800" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Larutan</text><rect x="30" y="272" width="200" height="120" rx="12" fill="#1E8E5A" filter="url(#sh)"/><text x="130.0" y="318.575" font-size="14.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Semua kation direduksi</text><text x="130.0" y="337.075" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >menjadi logam</text><text x="130.0" y="355.575" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Mⁿ⁺ + ne⁻ → M</text><rect x="340" y="272" width="220" height="54" rx="12" fill="#EEF2F8" stroke="#0E2240" stroke-width="2" filter="url(#sh)"/><text x="450.0" y="303.9" font-size="14" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kation = IA, IIA, Al, Mn?</text><path d="M390,326 V366" stroke="#0E2240" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><polygon points="390.0,368.0 385.7,359.0 394.3,359.0" fill="#0E2240"/><text x="376" y="348" font-size="13" font-weight="800" fill="#F26A21" text-anchor="end" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ya</text><path d="M510,326 V366" stroke="#0E2240" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><polygon points="510.0,368.0 505.7,359.0 514.3,359.0" fill="#0E2240"/><text x="524" y="348" font-size="13" font-weight="800" fill="#1E8E5A" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Tidak</text><rect x="310" y="370" width="160" height="120" rx="12" fill="#F26A21" filter="url(#sh)"/><text x="390.0" y="416.9" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >H₂O direduksi</text><text x="390.0" y="434.9" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >2H₂O + 2e⁻</text><text x="390.0" y="452.9" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >→ H₂ + 2OH⁻</text><rect x="482" y="370" width="96" height="120" rx="12" fill="#1E8E5A" filter="url(#sh)"/><text x="530.0" y="408.475" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Kation</text><text x="530.0" y="425.975" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >direduksi</text><text x="530.0" y="443.475" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >menjadi</text><text x="530.0" y="460.975" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >logam</text><rect x="30" y="520" width="540" height="172" rx="16" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><text x="52" y="552" font-size="15.5" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ingat:</text><text x="52" y="582" font-size="14.5" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >•  Larutan asam: 2H⁺ + 2e⁻ → H₂</text><text x="52" y="610" font-size="14.5" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >•  Na⁺, K⁺, Ca²⁺, Mg²⁺, Al³⁺ → yang direduksi H₂O</text><text x="52" y="638" font-size="14.5" font-weight="700" fill="#15243B" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >•  Cu²⁺, Ag⁺, Zn²⁺, Ni²⁺ → logamnya mengendap</text><text x="52" y="672" font-size="13.5" font-weight="600" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Leburan tidak ada air, jadi kation langsung direduksi.</text></svg>