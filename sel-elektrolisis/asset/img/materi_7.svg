</defs><rect x="0" y="0" width="600" height="720" rx="28" fill="url(#bgc)" /><path d="M0,28 Q0,0 28,0 H572 Q600,0 600,28 V92 H0 Z" fill="url(#hdr)"/><rect x="0" y="90" width="600" height="4" rx="0" fill="#FFC21A" /><text x="300.0" y="44" font-size="27" font-weight="800" fill="#fff" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Hukum Faraday</text><text x="300.0" y="70" font-size="14.5" font-weight="700" fill="#FFC21A" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Menghitung massa hasil elektrolisis</text><rect x="30" y="110" width="540" height="96" rx="16" fill="#fff" stroke="#FFC21A" stroke-width="2" filter="url(#sh)"/><text x="300" y="156" font-size="29" font-weight="800" fill="#0E2240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >m = (Ar × I × t) ÷ (n × F)</text><text x="300" y="188" font-size="14.5" font-weight="700" fill="#F26A21" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >F = 96.500 C per mol elektron</text><text x="300" y="236" font-size="15.5" font-weight="800" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Contoh: CuSO₄, I = 2 A, t = 965 s</text><rect x="40" y="252" width="520" height="64" rx="14" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><circle cx="74" cy="284" r="17" fill="#F26A21" stroke="#fff" stroke-width="2.5" /><text x="74" y="290" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >1</text><text x="104" y="280" font-size="17" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Q = I × t</text><text x="104" y="303" font-size="15" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >2 A × 965 s = 1.930 C</text><line x1="300" y1="318" x2="300.0" y2="328.0" stroke="#25508C" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,336.0 295.2,326.1 304.8,326.1" fill="#25508C"/><rect x="40" y="338" width="520" height="64" rx="14" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><circle cx="74" cy="370" r="17" fill="#F26A21" stroke="#fff" stroke-width="2.5" /><text x="74" y="376" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >2</text><text x="104" y="366" font-size="17" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >n(e⁻) = Q ÷ F</text><text x="104" y="389" font-size="15" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >1.930 ÷ 96.500 = 0,02 mol</text><line x1="300" y1="404" x2="300.0" y2="414.0" stroke="#25508C" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,422.0 295.2,412.1 304.8,412.1" fill="#25508C"/><rect x="40" y="424" width="520" height="64" rx="14" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><circle cx="74" cy="456" r="17" fill="#F26A21" stroke="#fff" stroke-width="2.5" /><text x="74" y="462" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >3</text><text x="104" y="452" font-size="17" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Cu²⁺ + 2e⁻ → Cu</text><text x="104" y="475" font-size="15" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >n(Cu) = 0,02 ÷ 2 = 0,01 mol</text><line x1="300" y1="490" x2="300.0" y2="500.0" stroke="#25508C" stroke-width="3" stroke-linecap="round"/><polygon points="300.0,508.0 295.2,498.1 304.8,498.1" fill="#25508C"/><rect x="40" y="510" width="520" height="64" rx="14" fill="#fff" stroke="#D7DEEA" stroke-width="2" filter="url(#sh)"/><circle cx="74" cy="542" r="17" fill="#1E8E5A" stroke="#fff" stroke-width="2.5" /><text x="74" y="548" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >4</text><text x="104" y="538" font-size="17" font-weight="800" fill="#0E2240" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >m = n × Ar</text><text x="104" y="561" font-size="15" font-weight="700" fill="#5A6B84" text-anchor="start" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >0,01 × 63,5 = 0,635 g</text><text x="300" y="624" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >n = jumlah elektron per ion (Cu²⁺ → 2, Ag⁺ → 1)</text><text x="300" y="650" font-size="14" font-weight="700" fill="#15243B" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Gas pada STP: V = mol × 22,4 L</text><text x="300" y="676" font-size="14" font-weight="700" fill="#5A6B84" text-anchor="middle" font-family="Arial, 'Segoe UI', 'DejaVu Sans', sans-serif" >Ar: Cu = 63,5  |  Ag = 108</text></svg>